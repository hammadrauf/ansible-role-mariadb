---
name: Ansible Galaxy
on:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
    tags:
      - "*"

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies - yamllint
        run: pip3 install yamllint

      - name: Install test dependencies - community.mysql
        run: ansible-galaxy collection install community.mysql --force

      - name: Run Yamllint
        run: yamllint .

      - name: Run ansible-lint
        uses: ansible/ansible-lint@main
        with:
          args: ""
          setup_python: "true"
          working_directory: "."
          requirements_file: "requirements.yml"

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu2404
          - debian12
          - fedora40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies - core
        run: pip3 install ansible-core molecule molecule-plugins[docker]

      - name: Install test dependencies - community.mysql
        run: ansible-galaxy collection install community.mysql

      - name: Run Molecule tests
        run: molecule test --all
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_IMAGE: "docker.io/geerlingguy/docker-${{ matrix.distro }}-ansible:latest"
          MOLECULE_DISTRO: "docker.io/geerlingguy/docker-${{ matrix.distro }}-ansible:latest"
          #MOLECULE_DISTRO: $({{ 'docker.io/geerlingguy/docker-${{ matrix.distro }}-ansible:latest' if '${{ matrix.distro }}' != 'fedora40' else 'quay.io/fedora/fedora:40' }})
          MOLECULE_CONTAINER_NAME: "instance-${{ matrix.distro }}"

  galaxy:
    name: Galaxy
    runs-on: ubuntu-latest
    needs: molecule
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pip3 install ansible-core

      - name: Install test dependencies - community.mysql
        run: ansible-galaxy collection install community.mysql

      - name: Trigger a new import on Galaxy
        run: >-
          ansible-galaxy role import --api-key ${{ secrets.GALAXY_API_KEY }}
          $(echo ${{ github.repository }} | cut -d/ -f1) $(echo ${{ github.repository }} | cut -d/ -f2)
